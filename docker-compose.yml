version: '3.8'

services:
  database:
    image: postgres:15
    container_name: inventory_postgres-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: USER_CREDENTIALS
      POSTGRES_PASSWORD: PASSWORD_CREDENTIALS
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    container_name: inventory_spring-boot-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: USER_CREDENTIALS
      SPRING_DATASOURCE_PASSWORD: PASSWORD_CREDENTIALS
    depends_on:
      - database
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: